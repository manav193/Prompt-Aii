name: Integrate Prompt Feedback

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/components/PromptFeedback.jsx'
      - 'backend/services/feedback.py'
      - '.github/workflows/integrate-prompt-feedback.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PromptAI integration points
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('backend/server.py')
          text = server.read_text()
          marker = 'from collections_data import (\n'
          imp = 'from services.feedback import register_feedback_routes\n'
          if imp not in text:
              text = text.replace(marker, imp + marker, 1)
          marker2 = '# ---------------------------------------------------------------------------\n# CORS + mount router\n# ---------------------------------------------------------------------------\napp.include_router(api)'
          replacement2 = '# ---------------------------------------------------------------------------\n# CORS + mount router\n# ---------------------------------------------------------------------------\nregister_feedback_routes(api, db, get_current_user)\napp.include_router(api)'
          if 'register_feedback_routes(api, db, get_current_user)' not in text:
              if marker2 not in text:
                  raise SystemExit('server integration marker not found')
              text = text.replace(marker2, replacement2, 1)
          server.write_text(text)

          page = Path('frontend/src/pages/Generate.jsx')
          text = page.read_text()
          imp = 'import PromptFeedback from "@/components/PromptFeedback";\n'
          if imp not in text:
              text = text.replace('import { Link } from "react-router-dom";\n', 'import { Link } from "react-router-dom";\n' + imp, 1)
          state = '  const [requestId, setRequestId] = useState(null);\n'
          if state not in text:
              text = text.replace('  const [savedId, setSavedId] = useState(null);\n', '  const [savedId, setSavedId] = useState(null);\n' + state, 1)
          old = '    setCopied(false); setFavorited(false); setSavedId(null);\n    try {\n      const { data } = await api.post("/generate/optimize", { idea, model, category });'
          new = '    setCopied(false); setFavorited(false); setSavedId(null);\n    const feedbackRequestId = globalThis.crypto?.randomUUID?.() || `req_${Date.now()}_${Math.random().toString(36).slice(2)}`;\n    setRequestId(feedbackRequestId);\n    try {\n      const { data } = await api.post("/generate/optimize", { idea, model, category, request_id: feedbackRequestId });'
          if old in text:
              text = text.replace(old, new, 1)
          feedback = '          <PromptFeedback idea={idea} prompt={optimized} model={model} category={category} requestId={requestId} />\n'
          anchor = '          <pre className="mt-4 whitespace-pre-wrap text-[14.5px] leading-relaxed font-mono-pa text-white/90 min-h-[140px]" data-testid="output-text">{optimized || (loading ? "Generating..." : "Your optimized prompt will appear here.")}</pre>\n'
          if 'data-testid="prompt-feedback"' not in text:
              if anchor not in text:
                  raise SystemExit('Generate output anchor not found')
              text = text.replace(anchor, anchor + feedback, 1)
          page.write_text(text)
          PY

      - name: Validate syntax and build
        run: |
          python -m py_compile backend/services/feedback.py
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit integration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py frontend/src/pages/Generate.jsx backend/services/feedback.py frontend/src/components/PromptFeedback.jsx
          git rm .github/workflows/integrate-prompt-feedback.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat(feedback): wire response feedback into PromptAI'
          git push
