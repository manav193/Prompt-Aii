name: Finish provider removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace legacy backend integration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("backend/server.py")
          text = path.read_text()

          text = text.replace('import httpx\n', '')
          text = text.replace('EMERGENT_SESSION_URL = "https://demobackend.emergentagent.com/auth/v1/env/oauth/session-data"\n', '')
          text = re.sub(r'\nclass GoogleSessionBody\(BaseModel\):\n    session_id: str\n', '\n', text)

          text = re.sub(
              r'\n# --- Auth: Google \(Emergent Managed OAuth\) ---.*?\n# --- Newsletter ---',
              '\n# --- Newsletter ---',
              text,
              flags=re.S,
          )

          optimize = '''\n@api.post("/generate/optimize")\nasync def optimize_prompt(body: OptimizeBody, user: dict = Depends(get_current_user)):\n    user = await maybe_refill_credits(user)\n    if user.get("subscription") != "pro" and int(user.get("credits_balance", 0)) < OPTIMIZE_COST:\n        raise HTTPException(\n            status_code=402,\n            detail=f"Not enough credits. You need {OPTIMIZE_COST} but have {int(user.get('credits_balance', 0))}. Upgrade to Pro for unlimited credits.",\n        )\n\n    instruction = (\n        "You are PromptAI's prompt-engineering co-pilot. Given a user's plain-English idea, "\n        "target AI model and category, produce one polished, production-ready prompt that is "\n        "idiomatic for that model and category. Output ONLY the optimized prompt, with no preamble, "\n        "quotes or commentary. Preserve proper nouns and concrete details. Keep it under 220 words."\n    )\n    user_text = f"Target model: {body.model}\\nCategory: {body.category}\\nUser idea:\\n{body.idea.strip()}"\n\n    try:\n        from services.nimo_client import NimoCoreError, generate_text\n        optimized = await generate_text(\n            instruction=instruction,\n            user_text=user_text,\n            request_id=f"optimize-{uuid.uuid4().hex[:12]}",\n        )\n    except Exception as exc:\n        logger.exception("NIMO-CORE optimizer call failed")\n        raise HTTPException(status_code=502, detail=f"Optimizer is unavailable right now: {exc}")\n\n    user = await consume_credits(user, OPTIMIZE_COST)\n    history_doc = {\n        "history_id": uuid.uuid4().hex,\n        "user_id": user["user_id"],\n        "kind": "optimize",\n        "promptlet_name": (body.idea.strip().split("\\n")[0][:80] or "Custom prompt"),\n        "category": body.category,\n        "model": body.model,\n        "idea": body.idea.strip(),\n        "prompt": optimized,\n        "cost": OPTIMIZE_COST,\n        "created_at": now_iso(),\n    }\n    await db.prompt_history.insert_one(history_doc)\n    return {"ok": True, "prompt": optimized, "credits": credit_summary(user), "cost": OPTIMIZE_COST, "history_id": history_doc["history_id"]}\n\n\n@api.post("/generate/save")'''
          text = re.sub(r'\n@api.post\("/generate/optimize"\).*?\n@api.post\("/generate/save"\)', optimize, text, flags=re.S)

          convert = '''\n@api.post("/convert")\nasync def convert_prompt(body: ConvertBody, user: dict = Depends(get_current_user)):\n    user = await maybe_refill_credits(user)\n    if user.get("subscription") != "pro" and int(user.get("credits_balance", 0)) < CONVERT_COST:\n        raise HTTPException(status_code=402, detail=f"Need {CONVERT_COST} credits, have {int(user.get('credits_balance', 0))}.")\n\n    instruction = (\n        "You are PromptAI's prompt converter. Convert a prompt written for one AI model into the "\n        "idiomatic, production-ready form for another AI model. Output ONLY the converted prompt, "\n        "with no preamble, quotes or commentary. Preserve all concrete details and intent. "\n        "Keep it under 240 words."\n    )\n    user_text = (\n        f"SOURCE MODEL: {body.source_model}\\n"\n        f"TARGET MODEL: {body.target_model}\\n\\n"\n        f"ORIGINAL PROMPT:\\n{body.prompt.strip()}"\n    )\n\n    try:\n        from services.nimo_client import generate_text\n        converted = await generate_text(\n            instruction=instruction,\n            user_text=user_text,\n            request_id=f"convert-{uuid.uuid4().hex[:12]}",\n        )\n    except Exception as exc:\n        logger.exception("NIMO-CORE converter call failed")\n        raise HTTPException(status_code=502, detail=f"Converter is unavailable right now: {exc}")\n\n    user = await consume_credits(user, CONVERT_COST)\n    history_doc = {\n        "history_id": uuid.uuid4().hex,\n        "user_id": user["user_id"],\n        "kind": "convert",\n        "promptlet_name": f"Convert {body.source_model} → {body.target_model}",\n        "category": "Convert",\n        "model": body.target_model,\n        "idea": body.prompt.strip()[:200],\n        "prompt": converted,\n        "cost": CONVERT_COST,\n        "created_at": now_iso(),\n    }\n    await db.prompt_history.insert_one(history_doc)\n    return {"ok": True, "prompt": converted, "credits": credit_summary(user), "cost": CONVERT_COST}\n\n\n# ---------------------------------------------------------------------------\n# Admin'''
          text = re.sub(r'\n@api.post\("/convert"\).*?\n# ---------------------------------------------------------------------------\n# Admin', convert, text, flags=re.S)

          path.write_text(text)
      
      - name: Verify no legacy provider code remains
        run: |
          ! grep -RniE 'emergent|EMERGENT_LLM_KEY|auth\.emergentagent\.com|emergentintegrations|customer-assets\.emergentagent\.com' frontend backend memory auth_testing.md --exclude-dir=node_modules --exclude-dir=.git
          python -m py_compile backend/server.py backend/services/nimo_client.py

      - name: Commit cleanup
        run: |
          git config user.name "PromptAI Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git add backend/services/nimo_client.py backend/requirements.txt memory/PRD.md auth_testing.md
          git add frontend
          git diff --cached --quiet || git commit -m "architecture: remove legacy provider and route AI through NIMO-CORE"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/finish-provider-removal.yml
          git commit -m "chore: remove temporary cleanup workflow"
          git push
